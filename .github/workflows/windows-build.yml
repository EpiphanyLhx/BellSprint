name: Windows build

on:
  push:
    branches: [main]
    paths:
      - "Windows/**"
      - "ClassBell/Sources/ClassBell/Resources/**"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "Windows/**"
      - "ClassBell/Sources/ClassBell/Resources/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test core logic
        run: dotnet test Windows/BellSprint.Core.Tests/BellSprint.Core.Tests.csproj -c Release

      - name: Publish Windows x64
        run: >-
          dotnet publish Windows/BellSprint.Windows/BellSprint.Windows.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -o artifacts/BellSprint-Windows-x64

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path artifacts/BellSprint-Windows-x64/* -DestinationPath artifacts/BellSprint-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BellSprint-Windows-x64
          path: artifacts/BellSprint-Windows-x64.zip
          if-no-files-found: error
